name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck zsh
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
      - name: shellcheck
        run: shellcheck bootstrap.sh lib/*.sh tests/*.sh $(find home/dot_scripts -type f -name '*.sh')
      - name: Bootstrap logging smoke test
        run: bash tests/bootstrap-logging.sh
      - name: APT update retry smoke test
        run: bash tests/apt-update-retry.sh
      - name: APT repository reconciliation smoke test
        run: bash tests/apt-repo-reconcile.sh
      - name: OneDrive setup smoke test
        run: bash tests/onedrive-setup.sh
      - name: Windows write retry smoke test
        run: bash tests/windows-write-retry.sh
      - name: GitHub token deployment smoke test
        run: bash tests/gh-token-deploy.sh
      - name: Render .zshrc for every machine type
        run: |
          for machine in wsl server laptop; do
            home="$(mktemp -d)"
            HOME="$home" MACHINE_TYPE="$machine" "$RUNNER_TEMP/bin/chezmoi" init --apply --source "$PWD"
            zsh -n "$home/.zshrc"
            for source in "$PWD"/home/.chezmoiscripts/run_after_deploy-windows-*.sh.tmpl; do
              deployer="$home/${source##*/}"
              HOME="$home" "$RUNNER_TEMP/bin/chezmoi" execute-template \
                -f "$source" >"$deployer"
              if [ "$machine" = wsl ]; then
                test -s "$deployer"
                shellcheck "$deployer"
              else
                test ! -s "$deployer"
              fi
            done
            echo "--- rendered $machine OK ---"
          done

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        machine: [server, wsl, laptop]
    runs-on: ubuntu-latest
    # Run inside the exact target OS; also keeps the install methods
    # snap-free by construction (no snapd in containers).
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap (${{ matrix.machine }})
        run: ./bootstrap.sh ${{ matrix.machine }}
      - name: Verify (${{ matrix.machine }})
        run: tests/verify.sh ${{ matrix.machine }}
